name: Source contract checks
on: [push, pull_request]
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_sources.py' -v
      - run: python -m compileall -q tools tests
# SQL Server regression tests require the explicit local setup described in README.
